<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the app use the full screen around a phone's notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Colour of the phone's browser bar, and full-screen mode when added to the home screen -->
  <meta name="theme-color" content="#F4F3EE">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Backtrack">
  <title>Backtrack</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap">
  <!-- All styles are in this one file -->
  <link rel="stylesheet" href="/backtrack.css">
</head>
<body>
<!-- The phone: on a laptop it's drawn as a phone frame; on a real phone it fills the screen -->
<div class="phone" id="phone">
 <!-- Everything in here scrolls. main.js adds the tab bar after it, at the bottom of the phone. -->
 <div class="phone-screen" id="screen">
  <!-- Top bar: logo on the left, menu button on the right. Stays on every page. -->
  <header class="bt-topbar" id="topbar">
    <div class="bt-topbar-inner">
      <a class="bt-wordmark" href="#/home">
        <svg class="bt-mark" viewBox="0 0 140 100" aria-hidden="true">
          <path style="stroke: var(--bt-green)" d="M44 84 A20 20 0 0 1 84 84"/>
          <path style="stroke: var(--bt-blue)" d="M24 84 A40 40 0 0 1 104 84"/>
          <path style="stroke: var(--bt-yellow)" d="M4 84 A60 60 0 0 1 124 84"/>
        </svg>
        Backtrack
      </a>
      <button type="button" class="bt-menu-button" data-open-menu aria-label="Open menu" aria-haspopup="dialog" aria-controls="bt-menu" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <!-- main.js puts the current page in here -->
  <div class="page" id="app"></div>
 </div>
</div>

  <!-- Components first (they set up window.Backtrack), then the router -->
  <script src="/components/navbar.js"></script>
  <script src="/components/menu.js"></script>
  <script type="module" src="/main.js"></script>
</body>
</html>
